# ============================================================
# המשימה האוטומטית של האתר — רצה בענן של GitHub, בחינם, פעם בשעה.
# לא צריך את המחשב הפרטי, לא צריך מפתחות, לא צריך סודות.
#
# מה היא עושה: מריצה את tools/update_data.py ושומרת את התוצאה
# (data/generated/) בחזרה לפרויקט. האתר קורא משם.
#
# הפעלה ידנית: בלשונית Actions ב-GitHub → "עדכון נתונים" → Run workflow
# ============================================================

name: עדכון נתונים

on:
  schedule:
    # פעמיים בשעה: GitHub מדלג על הרבה ריצות מתוזמנות (נצפה פער של 4 שעות), כך שבפועל יוצא בערך פעם בשעה
    - cron: "17,47 * * * *"
  # "הרץ עכשיו" בלי מפתחות: שינוי בקובץ הזה מפעיל עדכון מיד
  push:
    branches: [main]
    paths: [".github/run-data-now.txt"]
  workflow_dispatch: {}      # כפתור הפעלה ידנית

permissions:
  contents: write            # מותר לה רק לשמור קבצים בפרויקט. שום הרשאה אחרת.

concurrency:
  group: update-data
  cancel-in-progress: false  # לא להריץ שתיים במקביל

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: בדיקות החוזה של פינת המלחמות
        run: |
          python tools/test_war_contract.py
          python tools/test_site_static.py

      - name: קליטת ניתוחי מלחמות (תיבה → בדיקה → טיוטה; פרסום רק מאושרים)
        run: python tools/ingest_war.py

      - name: הרצת המשימה
        run: python tools/update_data.py

      - name: שמירה (רק אם משהו השתנה)
        run: |
          git config user.name  "news-site-bot"
          git config user.email "news-site-bot@users.noreply.github.com"
          git add data/generated data/war
          if git diff --cached --quiet; then
            echo "אין שינוי"
          else
            git commit -m "עדכון נתונים אוטומטי"
            git push
          fi
