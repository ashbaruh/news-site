# ============================================================
# עדכון ביניים לפי בקשה — נכתב ע"י Claude, בלי Gemini (CLAUDE.md).
#  1) שינוי ב-.github/run-collect-now.txt → איסוף כתבות בלבד → data/war/claude_input.json
#  2) Claude כותב data/war/claude_events.json ושומר → הרכבה + בדיקות → data/war/brief.js → ערוץ הטלגרם
# אין כאן שום קריאה לבינה.
# ============================================================

name: עדכון לפי בקשה (Claude)

on:
  push:
    branches: [main]
    paths: [".github/run-collect-now.txt", "data/war/claude_events.json", ".github/run-collect-deep-now.txt", "data/war/claude_deep_events.json"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: war-brief
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: מה השתנה
        id: what
        run: |
          CH=$(git diff --name-only HEAD~1 HEAD)
          if   echo "$CH" | grep -q "data/war/claude_deep_events.json"; then echo "step=build-deep" >> $GITHUB_OUTPUT
          elif echo "$CH" | grep -q "run-collect-deep-now.txt";          then echo "step=collect-deep" >> $GITHUB_OUTPUT
          elif echo "$CH" | grep -q "data/war/claude_events.json";       then echo "step=build" >> $GITHUB_OUTPUT
          else echo "step=collect" >> $GITHUB_OUTPUT; fi

      - name: איסוף
        if: steps.what.outputs.step == 'collect'
        run: python tools/brief_claude.py collect

      - name: הרכבה ובדיקות
        if: steps.what.outputs.step == 'build'
        run: |
          python tools/test_war_contract.py
          python tools/test_war_brief.py
          python tools/brief_claude.py build

      - name: איסוף לניתוח עמוק
        if: steps.what.outputs.step == 'collect-deep'
        run: python tools/brief_claude.py collect-deep

      - name: ניתוח עמוק — הרכבה, בדיקות, טיוטה, אישור ופרסום
        if: steps.what.outputs.step == 'build-deep'
        run: |
          python tools/test_war_contract.py
          python tools/brief_claude.py build-deep

      - name: פרסום לערוץ הטלגרם
        if: steps.what.outputs.step == 'build'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node tools/telegram_brief.js

      - name: שמירה
        if: always()
        run: |
          git config user.name  "news-site-bot"
          git config user.email "news-site-bot@users.noreply.github.com"
          git add data/war/claude_input.json data/war/claude_deep_input.json data/war/drafts data/war/rejected data/war/approved.json data/war/published.js data/war/brief.js data/war/brief_status.json data/war/geocache.json data/war/telegram_status.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "אין שינוי"; exit 0; fi
          git commit -m "עדכון לפי בקשה (Claude): ${{ steps.what.outputs.step }}"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
