# ============================================================
# ניתוח המלחמות היומי — פעם ביום, בענן, עם Gemini (חינם).
# איסוף מפידים → ניתוח → בדיקת חוזה → טיוטות → "בקשת אישור" (Issue) עם תצוגה מקדימה.
# שום דבר לא מתפרסם בלי שתכתוב "מאשר" בבקשה (ראה war-approve.yml).
# הפעלה ידנית: Actions → "ניתוח מלחמות יומי" → Run workflow
# ============================================================

name: ניתוח מלחמות יומי

on:
  schedule:
    # המכסה החינמית של Gemini מתאפסת ב-07:00 UTC (חצות בקליפורניה) = 10:00 בישראל.
    # לכן הריצה הראשית מיד אחרי האיפוס, וההשלמות באותו "יום מכסה".
    # GitHub מדלג לפעמים על ריצות מתוזמנות בשעות עומס (נצפה 18/09: 07:20 לא רץ בכלל).
    # לכן כמה "הזדמנויות" — כל ריצה מדלגת על זירות שכבר נותחו היום, כך שריצה מיותרת לא עולה כלום.
    - cron: "20 7 * * *"     # 07:20 UTC ≈ 10:20 בישראל — הניתוח הראשי (מיד אחרי איפוס המכסה)
    - cron: "50 7 * * *"     # 10:50
    - cron: "35 8 * * *"     # 11:35
    - cron: "25 9 * * *"     # 12:25
    - cron: "40 11 * * *"    # 14:40 — משלים זירות שנכשלו (Gemini החינמי עמוס לפעמים)
    - cron: "40 16 * * *"    # 19:40 — ניסיון אחרון להיום
  # "הרץ עכשיו" בלי מפתחות: שינוי בקובץ הזה (גם מהאתר של GitHub) מפעיל ניתוח מיד
  push:
    branches: [main]
    paths: [".github/run-war-now.txt"]
  workflow_dispatch:
    inputs:
      arenas:
        description: "זירות (מופרדות בפסיק)"
        default: "iran,ukraine,yemen,north"
      force:
        description: "לנתח שוב גם זירה שכבר נותחה היום"
        type: boolean
        default: false

permissions:
  contents: write            # לשמור טיוטות
  issues: write              # לפתוח בקשת אישור

concurrency:
  group: war-daily
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 70         # הניתוח נחתך ב-55; נשאר זמן לשמירה ולבקשת האישור
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: בדיקות (חוזה + סקריפט הניתוח + אישור)
        run: |
          python tools/test_war_contract.py
          python tools/mac/test_analyze.py
          python tools/test_war_approval.py
          python tools/test_site_static.py

      - name: איסוף וניתוח לכל הזירות
        timeout-minutes: 55
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
          # קלט ההרצה הידנית עובר דרך משתנה סביבה ונבדק — לא נכנס כטקסט לפקודה (מונע הזרקת פקודות)
          ARENAS_INPUT: ${{ inputs.arenas }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          ARENAS="${ARENAS_INPUT:-iran,ukraine,yemen,north}"
          if ! [[ "$ARENAS" =~ ^[a-z,]+$ ]]; then echo "רשימת זירות לא תקינה"; exit 1; fi
          FORCE=""; if [ "$FORCE_INPUT" = "true" ]; then FORCE="--force"; fi
          PYTHONUNBUFFERED=1 python tools/war_daily.py --arenas "$ARENAS" --new-drafts "$RUNNER_TEMP/new-drafts.json" $FORCE

      - name: פרסום אוטומטי (רק מה שעובר את כל בדיקות האיכות)
        if: always()
        run: python tools/war_approval.py auto "$RUNNER_TEMP/new-drafts.json"

      - name: שמירת הטיוטות והפרסום
        if: always()               # גם אם הניתוח נחתך — מה שכבר הסתיים נשמר
        run: |
          python tools/ingest_war.py
          git config user.name  "news-site-bot"
          git config user.email "news-site-bot@users.noreply.github.com"
          git add data/war
          if git diff --cached --quiet; then echo "אין שינוי"; exit 0; fi
          git commit -m "ניתוח מלחמות יומי — טיוטות ופרסום אוטומטי"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done

      - name: הודעה (מה פורסם, מה ממתין לאישור)
        if: always()               # נפתחת רק אם יש משהו חדש (נבדק בסקריפט)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/war_approval.py notify "$RUNNER_TEMP/new-drafts.json.decision.json"
