# ============================================================
# אישור ניתוח המלחמות — רץ כשכותבים תגובה ב"בקשת אישור".
# נחשבת רק תגובה של בעל הפרויקט, ורק בבקשה שהבוט פתח.
# ============================================================

name: אישור ניתוח מלחמות

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: war-approve
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.issue.user.login == 'github-actions[bot]' && github.event.comment.user.login == github.repository_owner && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: קריאת התגובה
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/war_approval.py approve "$GITHUB_EVENT_PATH"

      - name: פרסום ושמירה
        if: hashFiles('approval-result.json') != ''
        run: |
          python tools/ingest_war.py
          git config user.name  "news-site-bot"
          git config user.email "news-site-bot@users.noreply.github.com"
          git add data/war
          # אם התוכן שאושר כבר מפורסם — אין מה לשמור, וזו לא שגיאה
          if git diff --cached --quiet; then
            echo "אין שינוי לפרסום — התוכן שאושר כבר מופיע באתר" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "פרסום ניתוח מלחמות שאושר"
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
          fi

      - name: עדכון בבקשה
        if: hashFiles('approval-result.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/war_approval.py report approval-result.json
