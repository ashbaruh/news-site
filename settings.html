<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>הגדרות — חדר מצב</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="demo-banner" style="background:var(--bg-3);color:var(--text-dim)">
    ✏️ עריכה: כל כפתור "עריכה" פותח את הקובץ המתאים באתר GitHub. משנים, לוחצים <b>Commit changes</b> — והאתר מתעדכן תוך כמה דקות. חינם, בלי שרת.
  </div>

  <div class="topbar">
    <div class="wrap">
      <div class="logo">הגדרות</div>
      <nav><a href="index.html">← חזרה לדף הבית</a></nav>
    </div>
  </div>

  <main class="wrap" id="app">
    <p class="locked" style="margin-top:20px">
      כל מה שאפשר לשנות באתר מרוכז כאן, עם קישור ישיר לקובץ שקובע אותו.
    </p>
  </main>

  <script src="data/config.js"></script>
  <script src="data/sources.js"></script>
  <script src="data/athletes.js"></script>
  <script src="data/war/published.js"></script>
  <script src="assets/js/reliability.js"></script>
  <script>
  (function () {
    var C = window.DB.config, R = window.Reliability;
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); };

    var REPO = 'https://github.com/' + (C.repo || 'ashbaruh/news-site');
    function editLink(path, label) {
      return ' <a class="edit-link" href="' + REPO + '/edit/main/' + esc(path) + '" target="_blank" rel="noopener">✏️ ' +
             esc(label || 'עריכה') + '</a>';
    }
    function block(title, hint, inner, path) {
      return '<section class="set-block"><h2>' + esc(title) + (path ? editLink(path) : '') + '</h2>' +
             '<p class="hint">' + esc(hint) + '</p>' + inner + '</section>';
    }
    function chips(arr) {
      return '<div class="chips">' + arr.map(function (x) {
        return '<span class="chip">' + esc(x) + '</span>'; }).join('') + '</div>';
    }
    // "מוצג ציבורית" נבדק תמיד לפי כללי המצב הציבורי — לא לפי המצב הנוכחי
    function publicOk(src) { return src.license_mode !== 'personal_only' && src.license_mode !== 'unclear'; }
    function when(iso) {
      var d = new Date(iso);
      return isNaN(d) ? '—' : d.toLocaleString('he-IL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    var html = '';

    var repoParts = (C.repo || 'ashbaruh/news-site').split('/');
    html += block('מיתוג וכתובת',
      'שם זמני. דומיין משלך עולה כסף — לכן האתר יעלה בכתובת החינמית של GitHub Pages.',
      '<label>שם האתר <input type="text" value="' + esc(C.brand.site_name) + '" disabled></label> ' +
      '<label>כתובת <input type="text" value="' + esc(repoParts[0] + '.github.io/' + repoParts[1]) + '" disabled></label>',
      'data/config.js');

    html += block('מצב פרסום',
      'אישי = הכל מוצג. ציבורי = מקורות "שימוש אישי בלבד" (CNBC, ESPN, טלגרם, אל-מנאר) נחסמים, ובמקומם TradingView וכותרות מוואלה/ONE. ' +
      'לראות איך זה ייראה בלי לשנות כלום: הכפתור "תצוגה מקדימה ציבורית".',
      '<select disabled><option>' + (C.publish_mode === 'public' ? 'ציבורי' : 'אישי') + '</option></select> ' +
      '<a class="edit-link" href="index.html?mode=public">👁️ תצוגה מקדימה ציבורית</a>',
      'data/config.js');

    var PUB = window.DB.war_published || {};
    html += block('פינת המלחמות — ניתוח יומי',
      'Gemini (חינמי) מנתח כל יום ב-10:20, 14:40 ו-19:40 (שעון ישראל) — הריצות המאוחרות משלימות רק זירות שנכשלו. ' +
      'שום דבר לא מתפרסם בלי "מאשר" שלך בבקשת האישור ב-GitHub.',
      '<ul class="rows">' + C.arenas.map(function (a) {
        var p = PUB[a.id];
        return '<li><b>' + esc(a.name) + '</b> <span class="locked">— ' +
               (p ? 'ניתוח מאושר אחרון: ' + when(p.analysis.generated_at) + ' · ' + p.analysis.events.length + ' אירועים'
                  : 'עדיין אין ניתוח מאושר') +
               ' · רמת ביטחון מפה: ' + esc(a.map_confidence) + '</span></li>';
      }).join('') + '</ul>' +
      '<p><a class="edit-link" href="' + REPO + '/issues" target="_blank" rel="noopener">📬 בקשות אישור פתוחות</a> ' +
      '<a class="edit-link" href="' + REPO + '/actions/workflows/war-daily.yml" target="_blank" rel="noopener">▶️ הרצה ידנית של הניתוח</a> ' +
      editLink('tools/war_feeds.py', 'מקורות וערוצי טלגרם') + '</p>');

    html += block('Watchlist שווקים',
      'הסמלים שבמעקב. להוספה/הסרה — עריכה בקובץ (הרשימה watchlist).',
      '<h3 class="sub">קריפטו</h3>' + chips(C.watchlist.crypto) +
      '<h3 class="sub">מניות</h3>' + chips(C.watchlist.stocks) +
      '<h3 class="sub">פורקס / סחורות</h3>' + chips(C.watchlist.fx_commodities), 'data/config.js');

    var A = window.DB.athletes || { players: [], to_check: [] };
    var ICON = { abroad: '✅', manual: '⚠️', returned: '🏠', inactive: '⏸️' };
    function playerRow(a) {
      return '<li>' + (ICON[a.status] || '') + ' <b>' + esc(a.name) + '</b> · ' + esc(a.club) +
             ' <span class="locked">' + (a.country ? '· ' + esc(a.country) : '') + (a.note ? ' · ' + esc(a.note) : '') + '</span></li>';
    }
    function group(title, arr) {
      return arr.length ? '<h3 class="sub">' + title + ' (' + arr.length + ')</h3><ul class="rows">' + arr.map(playerRow).join('') + '</ul>' : '';
    }
    var P = A.players;
    html += block('מאגר ישויות — ספורטאים ישראלים (' + P.length + ')',
      'רשימה ידנית, מאומתת מול ' + (A.checked_with || '') + ' ב-' + A.checked_at + '. ' +
      '✅ בחו"ל, אומת — מקבל תוצאות באתר · ⚠️ לא נמצא ב-ESPN, לא אומת · 🏠 חזר לארץ · ⏸️ לא פעיל.',
      group('NBA', P.filter(function (p) { return p.sport === 'nba'; })) +
      group('כדורגל — בחו"ל, אומת', P.filter(function (p) { return p.sport === 'soccer' && p.status === 'abroad'; })) +
      group('כדורגל — לא אומת (ליגות נמוכות)', P.filter(function (p) { return p.status === 'manual'; })) +
      group('חזרו לארץ — לא במעקב', P.filter(function (p) { return p.status === 'returned'; })) +
      group('לא פעילים', P.filter(function (p) { return p.status === 'inactive'; })) +
      (A.to_check.length ? '<h3 class="sub">שמות לבירור</h3><ul class="rows">' +
        A.to_check.map(function (t) { return '<li class="locked">' + esc(t) + '</li>'; }).join('') + '</ul>' : ''),
      'data/athletes.js');

    html += block('פלייליסטים YouTube',
      'תיקייה אחת מסומנת כברירת מחדל ומתחילה לנגן בכניסה.',
      '<ul class="rows">' + C.playlists.map(function (p) {
        return '<li>' + esc(p.name) + ' <span class="locked">' + (p.is_default ? '· ברירת מחדל' : '') + '</span></li>';
      }).join('') + '</ul>', 'data/config.js');

    html += block('קצב רענון לפי פינה',
      'המטמון המתגלגל. "מתעכב" = עבר max_age. "מיושן" = עבר stale_at.',
      '<table class="src"><thead><tr><th>פינה</th><th>עדכני עד</th><th>מיושן אחרי</th></tr></thead><tbody>' +
      Object.keys(C.cadence).map(function (k) {
        var c = C.cadence[k];
        var fmt = function (s) { return s < 3600 ? Math.round(s/60) + ' דק\'' : Math.round(s/3600) + ' שעות'; };
        return '<tr><td>' + esc(c.label) + '</td><td>' + fmt(c.max_age) + '</td><td>' + fmt(c.stale_at) + '</td></tr>';
      }).join('') + '</tbody></table>', 'data/config.js');

    html += block('מקורות ורישוי',
      'license_mode נקבע ברגע חיבור המקור, לא בדיעבד. independence_group מונע ספירת שני מקורות מאותה משפחה כשני אימותים.',
      '<table class="src"><thead><tr><th>מקור</th><th>סוג</th><th>רישוי</th><th>משפחת מקורות</th><th>מוצג ציבורית</th></tr></thead><tbody>' +
      window.DB.sources.map(function (s) {
        return '<tr class="' + (publicOk(s) ? '' : 'blocked') + '">' +
          '<td>' + esc(s.name) + '</td><td>' + esc(s.kind) + '</td>' +
          '<td>' + esc(R.licenseLabel(s)) + '</td>' +
          '<td class="root">' + esc(s.independence_group) + '</td>' +
          '<td>' + (publicOk(s) ? '✔️' : '✖️') + '</td></tr>';
      }).join('') + '</tbody></table>', 'data/sources.js');

    html += block('קישורי רשתות חברתיות',
      'placeholder — נחליף בקישורים האמיתיים שלך.',
      '<ul class="rows">' + C.social.map(function (s) {
        return '<li>' + esc(s.name) + ' <span class="locked">' + esc(s.url) + '</span></li>';
      }).join('') + '</ul>', 'data/config.js');

    document.getElementById('app').insertAdjacentHTML('beforeend', html);
  })();
  </script>
</body>
</html>
